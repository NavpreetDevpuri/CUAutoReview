name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint, tests and PostgreSQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cuautoreview_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d cuautoreview_ci"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            platform/backend/requirements*.txt
            poc/requirements.txt
      - run: pip install -r platform/backend/requirements-dev.txt -r poc/requirements.txt
      - name: Ruff lint
        run: ruff check platform/backend poc platform/scripts
      - name: Ruff format
        run: ruff format --check platform/backend poc platform/scripts
      - name: Platform backend tests (including migrations on PostgreSQL)
        working-directory: platform/backend
        env:
          CUAUTOREVIEW_TEST_POSTGRES_URL: postgresql+psycopg://ci:ci@localhost:5432/cuautoreview_ci
        run: python -m pytest -q
      - name: POC tests
        working-directory: poc
        run: python -m pytest -q tests

  web:
    name: Frontend typecheck, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python runtime dependencies
        run: |
          pip install pip-audit
          pip-audit -r platform/backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend runtime dependencies
        working-directory: platform/web
        run: npm audit --omit=dev --audit-level=high

  docker-quickstart:
    name: Docker quickstart (amd64, no model calls)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [python, web]
    env:
      COMPOSE: docker compose -f platform/compose.yaml
    steps:
      - uses: actions/checkout@v4
      - name: Production override renders only with required secrets
        run: |
          if docker compose -f platform/compose.yaml -f platform/compose.prod.yaml config >/dev/null 2>&1; then
            echo "Production override rendered without required secrets" >&2; exit 1
          fi
          CUAUTOREVIEW_DATABASE_URL=postgresql+psycopg://cu:ci-db@postgres:5432/cuautoreview \
          CUAUTOREVIEW_POSTGRES_PASSWORD=ci-db \
          CUAUTOREVIEW_BROKER_URL=amqp://cu:ci-mq@rabbitmq:5672/cuautoreview \
          CUAUTOREVIEW_RABBITMQ_PASSWORD=ci-mq \
          CUAUTOREVIEW_S3_BUCKET=ci CUAUTOREVIEW_S3_ACCESS_KEY=ci CUAUTOREVIEW_S3_SECRET_KEY=ci \
          CUAUTOREVIEW_S3_IDENTITIES=/dev/null \
          CUAUTOREVIEW_PUBLIC_ORIGIN=https://review.example.com \
            docker compose -f platform/compose.yaml -f platform/compose.prod.yaml config >/dev/null
      - name: Build and start the stack
        run: $COMPOSE up --build -d --wait
      - name: Seed and verify
        run: |
          $COMPOSE run --rm seed
          $COMPOSE run --rm --no-deps --entrypoint python seed /workspace/platform/scripts/verify_docker_quickstart.py
      - name: Reseed and verify identities are stable
        run: |
          $COMPOSE run --rm seed
          $COMPOSE run --rm --no-deps --entrypoint python seed /workspace/platform/scripts/verify_docker_quickstart.py
      - name: Readiness and security headers
        run: |
          curl -fsS http://127.0.0.1:8000/api/ready
          curl -fsSI http://127.0.0.1:8000/ | grep -i '^content-security-policy:'
      - name: Service logs
        if: failure()
        run: $COMPOSE logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: $COMPOSE down -v
