name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and POC tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            platform/backend/requirements.txt
            poc/requirements.txt
      - run: pip install -r platform/backend/requirements.txt -r poc/requirements.txt
      - name: Platform backend
        working-directory: platform/backend
        run: python -m pytest -q
      - name: POC contracts
        working-directory: poc
        run: python -m pytest -q tests

  web:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  docker-quickstart:
    name: Docker quickstart (amd64, no model calls)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, web]
    env:
      COMPOSE: docker compose -f platform/compose.yaml
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: $COMPOSE up --build -d --wait
      - name: Seed and verify
        run: |
          $COMPOSE run --rm seed
          $COMPOSE run --rm --no-deps --entrypoint python seed /workspace/platform/scripts/verify_docker_quickstart.py
      - name: Reseed and verify identities are stable
        run: |
          $COMPOSE run --rm seed
          $COMPOSE run --rm --no-deps --entrypoint python seed /workspace/platform/scripts/verify_docker_quickstart.py
      - name: Service logs
        if: failure()
        run: $COMPOSE logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: $COMPOSE down -v
