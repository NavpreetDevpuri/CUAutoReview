# Alembic settings for developers (e.g. `alembic revision --autogenerate -m "..."` from platform/backend).
# The application and the migrate job use app.core.migrate, which points at the same script location.
# The database URL always comes from DATABASE_URL via app.core.config; never put credentials here.
[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
