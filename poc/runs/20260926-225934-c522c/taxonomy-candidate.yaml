summary: 'Eight draft mechanism labels retained. Similar UI-targeting proposals remain
  separate because the observed effects differ: failure to activate a control, activation
  of an unintended control, persistent modal dismissal failure, and entry into a still-focused
  wrong field.'
labels:
- id: c01
  name: Repeated intended-control activation miss
  description: Repeated coordinate clicks fail to activate the intended control before
    another interaction method is used.
  aliases:
  - Repeated mis-targeted UI activation
  status: draft
- id: c02
  name: Unintended control activation
  description: An action aimed at one control activates a different control or command.
  aliases:
  - Wrong UI target activated
  status: draft
- id: c03
  name: Persistent modal after dismissal attempts
  description: A blocking modal remains present despite repeated close, cancel, escape,
    or window-dismissal attempts.
  aliases:
  - Repeated ineffective modal dismissal
  status: draft
- id: c04
  name: Network-path resource blockage
  description: A proxy or network-path error makes an online resource unreachable.
  aliases:
  - Online resource blocked by proxy or network path
  status: draft
- id: c05
  name: Malformed command-entry sequence
  description: An incorrectly constructed key or input sequence inserts unintended
    characters or prevents clean command submission.
  aliases:
  - Malformed command-entry key sequence
  status: draft
- id: c06
  name: Retrieved scope mismatch
  description: Retrieved information has a narrower or different scope than the information
    requested.
  aliases:
  - Retrieved information does not match requested scope
  status: draft
- id: c07
  name: Entry into still-focused wrong field
  description: Focus remains in a different field, causing the next value to be appended
    there instead of entered in its intended field.
  aliases:
  - Numeric entry appended in wrong field
  status: draft
- id: c08
  name: Dialog abandoned before correction and confirmation
  description: Interaction stops while required dialog values remain incorrect and
    before the dialog is confirmed.
  aliases:
  - Required dialog action left incomplete
  status: draft
mappings:
- proposal_id: p001
  canonical_label_id: c01
  rationale: Across the layer, Insert-menu, and table-dialog episodes, repeated coordinate
    clicks did not activate the intended control; keyboard interaction later bypassed
    the apparent targeting problem.
- proposal_id: p002
  canonical_label_id: c02
  rationale: The reviewed clicks activated Function Wizard and unrelated Writer commands
    rather than their intended spreadsheet or Header and Footer targets.
- proposal_id: p003
  canonical_label_id: c03
  rationale: Function Wizard remained visible in later frames after repeated close,
    Cancel, Escape, and Alt+F4 attempts.
- proposal_id: p004
  canonical_label_id: c04
  rationale: The browser visibly showed a proxy-authentication error blocking the
    selected online source.
- proposal_id: p005
  canonical_label_id: c05
  rationale: Escaped newline input and sequential shortcut keys likely interfered
    with clean terminal command submission before corrected entry produced output.
- proposal_id: p006
  canonical_label_id: c06
  rationale: The visible terminal result was a short-range weather table rather than
    the requested monthly forecast.
- proposal_id: p007
  canonical_label_id: c07
  rationale: The intended Rows value was appended to Columns because focus apparently
    remained in the Columns field.
- proposal_id: p008
  canonical_label_id: c08
  rationale: The final retained frame still showed an incorrect Rows value and an
    unconfirmed insertion dialog when interaction ended.
unresolved:
- The sparse screenshots do not establish whether c01 and c02 share an underlying
  coordinate-mapping cause; they remain separate because c01 records non-activation
  while c02 records activation of a different control.
- For c03, the evidence does not distinguish modal behavior from repeated inaccurate
  targeting of dismissal controls, so it is not merged with the coordinate-targeting
  labels.
